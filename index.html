<style>

  }
  h1{

  }

  .wrap{max-width:900px;margin:0 auto;padding:52px 24px 100px;}

  .controls{margin-bottom:32px;}

  }

  }

  #tag-select, #sort-select{

<script>
const grid = document.getElementById('ledger-grid');
const tagSelect = document.getElementById('tag-select');
const searchInput = document.getElementById('search-input');
const sortSelect = document.getElementById('sort-select');
const resultsCount = document.getElementById('results-count');

// Build the full tag set across all entries (entries without tags simply contribute none)
const allTags = Array.from(new Set(
  LEDGER_ENTRIES.flatMap(e => e.tags || [])
)).sort();

function renderTagSelect() {
  allTags.forEach(tag => {
    const opt = document.createElement('option');
    opt.value = tag;
    opt.textContent = tag;
    tagSelect.appendChild(opt);
  });
}

function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function matchesSearch(entry, q) {
  if (!q) return true;
  const hay = [entry.title, entry.dek, entry.summary, ...(entry.tags || [])]
    .join(' ')
    .toLowerCase();
  return hay.includes(q);
}

function sortEntries(list) {
  const mode = sortSelect.value;
  // "Newest"/"oldest" sort by whichever is more recent for that entry —
  // its update date if it has one, otherwise its original publish date.
  const effectiveDate = e => e.updated || e.date;
  const withDate = list.filter(e => effectiveDate(e));
  const withoutDate = list.filter(e => !effectiveDate(e));
  if (mode === 'title') {
    return [...list].sort((a, b) => a.title.localeCompare(b.title));
  }
  withDate.sort((a, b) => mode === 'oldest'
    ? new Date(effectiveDate(a)) - new Date(effectiveDate(b))
    : new Date(effectiveDate(b)) - new Date(effectiveDate(a)));
  // Undated entries (older pieces published before dates were tracked) sort to the end
  return [...withDate, ...withoutDate];
}

function renderGrid() {
  const q = searchInput.value.trim().toLowerCase();
  let filtered = LEDGER_ENTRIES.filter(e => matchesSearch(e, q));
  const activeTag = tagSelect.value;
  if (activeTag) {
    filtered = filtered.filter(e => (e.tags || []).includes(activeTag));
  }
  filtered = sortEntries(filtered);

  grid.innerHTML = '';
  filtered.forEach(e => {
    const card = document.createElement('div');
    card.className = 'card';
    const tagsHtml = (e.tags || []).slice(0, 8).map(t => `<span>${t}</span>`).join('');
    card.innerHTML = `
      <div class="card-top-row">
        <span class="case-tag">${e.tag}</span>
        <div class="card-dates">
          ${e.date ? `<span class="card-date">Published ${formatDate(e.date)}</span>` : ''}
          ${e.updated ? `<span class="card-updated">↻ Updated ${formatDate(e.updated)}</span>` : ''}
        </div>
      </div>
      <h2>${e.title}</h2>
      <div class="dek">${e.dek}</div>
      ${e.total ? `<div class="card-total">$${e.total.toLocaleString()}${e.totalPlus ? '<span class="ct-plus">+</span>' : ''}<span class="ct-label">documented</span></div>` : ''}
      <p class="summary">${e.summary}</p>
      ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
      <a class="open-link" href="${e.url}">Open the visualization →</a>
    `;
    grid.appendChild(card);
  });

  resultsCount.textContent = `${filtered.length} of ${LEDGER_ENTRIES.length} piece${LEDGER_ENTRIES.length === 1 ? '' : 's'} shown`;

  if (LEDGER_ENTRIES.length < 3 && filtered.length === LEDGER_ENTRIES.length) {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = 'More money-flow pieces will be added here as they\'re published.';
    grid.appendChild(ph);
  } else if (filtered.length === 0) {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = 'No pieces match that search or tag. Try clearing the filter.';
    grid.appendChild(ph);
  }
}

searchInput.addEventListener('input', renderGrid);
sortSelect.addEventListener('change', renderGrid);
tagSelect.addEventListener('change', renderGrid);

renderTagSelect();
renderGrid();
</script>
