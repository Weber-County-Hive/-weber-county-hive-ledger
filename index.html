<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Weber County Hive — Money-Flow Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Serif+4:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f0e6;
    --paper-card:#faf7ef;
    --paper-card-2:#f0ecdf;
    --ink:#1c1c1a;
    --ink-dim:#5b5850;
    --ink-dimmer:#8c8878;
    --rust:#c0572e;
    --amber:#d9a441;
    --border:#ddd6c4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Source Serif 4', serif;line-height:1.5;}

  header{
    background:linear-gradient(160deg, #4a3018 0%, #241608 100%);
    padding:60px 24px 46px;
    border-bottom:4px solid var(--amber);
  }
  .header-inner{max-width:900px;margin:0 auto;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:3px;
    color:#c9a06a; text-transform:uppercase;
    margin-bottom:12px;
  }
  h1{
    font-family:'Playfair Display', serif;
    font-weight:800;
    font-size:clamp(2rem, 4.5vw, 3rem);
    color:#f4e6c8;
  }
  header p{
    color:#c9b896;
    font-family:'Source Serif 4', serif;
    font-style:italic;
    margin-top:10px;
    max-width:560px;
    font-size:1.05rem;
  }

  .wrap{max-width:900px;margin:0 auto;padding:52px 24px 100px;}

  .docket-grid{display:grid; gap:20px;}

  .card{
    background:var(--paper-card);
    border:1px solid var(--border);
    border-radius:4px;
    padding:28px 28px 24px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(28,24,20,0.1);}
  .case-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--amber);
    background:var(--paper-card-2);
    border:1px solid var(--border);
    padding:3px 10px;
    border-radius:3px;
    margin-bottom:12px;
  }
  .card h2{
    font-family:'Playfair Display', serif;
    font-size:1.55rem;
    color:var(--ink);
    margin-bottom:8px;
  }
  .card .dek{
    font-family:'Source Serif 4', serif;
    font-style:italic;
    color:var(--ink-dim);
    font-size:0.98rem;
    margin-bottom:14px;
  }
  .card p.summary{color:var(--ink-dim); font-size:0.95rem; margin-bottom:18px;}
  .card a.open-link{
    font-family:'Inter', sans-serif;
    font-size:0.86rem; font-weight:600;
    color:var(--rust); text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .card a.open-link:hover{border-bottom-color:var(--rust);}

  .placeholder{
    border:1px dashed var(--border);
    border-radius:4px;
    padding:22px 24px;
    color:var(--ink-dimmer);
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    text-align:center;
  }

  footer{
    text-align:center;
    padding:30px 24px 50px;
    color:var(--ink-dimmer);
    font-family:'Inter', sans-serif;
    font-size:0.8rem;
  }
  footer a{color:var(--rust); text-decoration:none; font-weight:600;}
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="eyebrow">The Weber County Hive · Money-Flow Ledger</div>
      <h1>Where the money moves</h1>
      <p>Interactive campaign-finance visualizations tracing PAC money as it flows through Utah politics.</p>
    </div>
  </header>

  <div class="wrap">
    <div class="docket-grid" id="ledger-grid"></div>
  </div>

  <footer>
    Read the full investigations on <a href="https://webercountyhive.substack.com" target="_blank" rel="noopener">The Weber County Hive Substack →</a>
  </footer>

<script src="ledger-data.js"></script>
<script>
const grid = document.getElementById('ledger-grid');
LEDGER_ENTRIES.forEach(e => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <span class="case-tag">${e.tag}</span>
    <h2>${e.title}</h2>
    <div class="dek">${e.dek}</div>
    <p class="summary">${e.summary}</p>
    <a class="open-link" href="${e.url}">Open the visualization →</a>
  `;
  grid.appendChild(card);
});
if (LEDGER_ENTRIES.length < 3) {
  const ph = document.createElement('div');
  ph.className = 'placeholder';
  ph.textContent = 'More money-flow pieces will be added here as they\'re published.';
  grid.appendChild(ph);
}
</script>
</body>
</html>
